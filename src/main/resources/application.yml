spring:
  application:
    name: swing-scope

  datasource:
    url: jdbc:h2:file:./data/swing-scope;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  # SQL console for inspecting the journal by hand: /swing-scope/h2-console
  # JDBC URL to paste there: jdbc:h2:file:./data/swing-scope   user: sa   (no password)
  # Bound to localhost only. Set enabled:false if this app is ever exposed to a network.
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

server:
  port: 8080
  servlet:
    context-path: /swing-scope

trading:
  rules:
    min-risk-reward: 2.0
    default-account-size: 500
    default-risk-amount: 5.00   # dollars at risk per trade

marketdata:
  # Primary: quotes, daily candles (the EMA input), symbol search.
  twelvedata:
    base-url: https://api.twelvedata.com
    api-key: ${TWELVEDATA_API_KEY:}
    enabled: true
    retries: 2
    retry-backoff: 500ms
    requests-per-minute: 8      # free-tier ceiling; scans are paced to it
  # Secondary: earnings, market status, market cap. Never candles — those are premium-only now.
  finnhub:
    base-url: https://finnhub.io/api/v1
    api-key: ${FINNHUB_API_KEY:}
    enabled: true
    retries: 2
    retry-backoff: 500ms
    requests-per-minute: 60
  # Sized against Twelve Data's 800-calls-per-day free tier.
  ttl:
    quote: 5m
    candles: 6h
    earnings: 12h
    profile: 24h
    search: 24h
    news: 1h
    market-status: 10m

# OpenAPI / Swagger UI. Only /api/** is documented — the other routes are Thymeleaf form
# handlers that return HTML, not an API surface.
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  paths-to-match: /api/**

# Phase 6 — suggested stop/target levels.
# NOTE: these defaults are guesses until the Phase 6A backtest harness measures them.
levels:
  pivot-strength: 3               # bars either side needed to confirm a pivot
  atr-period: 14
  zone-tolerance-atr-multiple: 0.5  # pivots within 0.5×ATR collapse into one zone
  stop-buffer-atr-multiple: 0.5     # stop sits this far below support
  min-touches: 2                  # pivots a zone needs to count as a level
  max-stop-percent: 15            # refuse a stop wider than this
  min-bars-for-suggestion: 60     # below this much history, refuse rather than guess
  lookback-bars: 250

logging:
  level:
    root: INFO
    com.swingscope: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-        }] %logger{36} - %msg%n"
  file:
    name: logs/swing-scope.log

# Tier 1 needs BOTH: liquid enough to fill, big enough to be established.
# NOTE: market cap is in MILLIONS, matching what Finnhub reports. 2000 = $2B.
scan:
  tier1-min-volume: 1000000
  tier1-min-market-cap-millions: 2000
  max-tickers-per-scan: 30
