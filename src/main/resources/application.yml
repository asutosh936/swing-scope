spring:
  application:
    name: swing-scope

server:
  port: 8080
  servlet:
    context-path: /swing-scope

trading:
  rules:
    min-risk-reward: 2.0
    default-account-size: 500
    default-risk-amount: 5.00   # dollars at risk per trade

marketdata:
  # Primary: quotes, daily candles (the EMA input), symbol search.
  twelvedata:
    base-url: https://api.twelvedata.com
    api-key: ${TWELVEDATA_API_KEY:}
    enabled: true
    retries: 2
    retry-backoff: 500ms
  # Secondary: earnings, market status, market cap. Never candles — those are premium-only now.
  finnhub:
    base-url: https://finnhub.io/api/v1
    api-key: ${FINNHUB_API_KEY:}
    enabled: true
    retries: 2
    retry-backoff: 500ms
  # Sized against Twelve Data's 800-calls-per-day free tier.
  ttl:
    quote: 5m
    candles: 6h
    earnings: 12h
    profile: 24h
    search: 24h
    market-status: 10m

logging:
  level:
    root: INFO
    com.swingscope: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-        }] %logger{36} - %msg%n"
  file:
    name: logs/swing-scope.log
